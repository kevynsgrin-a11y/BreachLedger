name = "breachledger-ingest-cron"
main = "src/index.js"
compatibility_date = "2026-07-01"

# INERT. This Worker is not deployed (see README, "Build phases"), so these
# triggers do not fire. The daily ingest that actually runs today is GitHub
# Actions' own schedule in .github/workflows/ingest.yml, which invokes
# packages/ingest/run.js directly on the runner. Its 06:00 UTC cron and the
# first entry below are the same value by coincidence, not by connection:
# changing one does NOT change the other. These stay here as the intended
# schedule for when ingest-cron is deployed.
[triggers]
crons = ["0 6 * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "breachledger"
database_id = "13473ea8-386a-45f1-a941-e4f1c7b795ec"

[[kv_namespaces]]
binding = "HOT"
id = "27fd610a89594889984b0f1985fa7539"
