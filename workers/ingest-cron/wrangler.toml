name = "breachledger-ingest-cron"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Daily 06:00 UTC full ingest; hourly settlement-deadline refresh.
[triggers]
crons = ["0 6 * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "breachledger"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "HOT"
id = "00000000000000000000000000000000"
