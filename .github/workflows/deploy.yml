name: Deploy to Cloudflare Pages

# Deploys on every push to the production branch once the two repository
# secrets exist (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - API token with Pages:Edit (+ D1:Edit, KV:Edit for provisioning)
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id
# Optionally set the repository variable SITE_ORIGIN to override the build
# origin; it defaults to the production domain https://breachbook.org.
# Without the secrets the workflow fails at the deploy step and publishes nothing.

on:
  push:
    branches:
      - claude/breachledger-build-y3652a
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fail early and legibly rather than 40 lines deep in a wrangler stack trace.
      - name: Verify credentials are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions, then re-run. Nothing was deployed."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings > Secrets and variables > Actions, then re-run. Nothing was deployed."
            exit 1
          fi

      - run: npm test

      # site/data is generated, not committed: D1 is the canonical store. The
      # export MUST run before the build, or this would publish an empty site
      # and delete every breach page currently live.
      - name: Export build input from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/export-data.js --remote

      - run: npm run build
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://breachbook.org' }}

      # Guard against publishing a catastrophically smaller site than the one
      # already live, which is what a failed or partial export looks like.
      - name: Sanity-check the built output
        run: |
          pages=$(find dist -name index.html | wc -l)
          echo "built $pages pages"
          if [ "$pages" -lt 5 ]; then
            echo "::error::only $pages pages built; refusing to deploy a truncated site"
            exit 1
          fi
      # --branch must equal the Pages project's Production branch, or the
      # upload is published as a preview and the custom domain is unaffected.
      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name breachledger --branch ${{ vars.PAGES_BRANCH || 'main' }}
