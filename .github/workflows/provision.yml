name: Provision Cloudflare resources

# Run this ONCE, manually (Actions > Provision Cloudflare resources > Run workflow),
# before the first deploy. It is idempotent, so re-running is safe.
#
# It creates the D1 database and KV namespace, applies migrations to the remote
# D1, loads the seed tables, and creates the Pages project. It then prints the
# resource ids, which must be committed into the wrangler.toml files — a CI run
# cannot commit them for you, so they are echoed to the job summary.
#
# Requires the same two secrets as deploy.yml:
#   CLOUDFLARE_API_TOKEN   (Pages:Edit, D1:Edit, Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify credentials are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Provision D1, KV, and the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_BRANCH: ${{ vars.PAGES_BRANCH || 'main' }}
        run: npm run provision

      - name: Report resource ids for committing
        if: always()
        run: |
          {
            echo '## Resource ids to commit'
            echo
            echo 'Copy these into the four wrangler.toml files (root and workers/*), replacing the placeholder ids:'
            echo
            echo '```'
            grep -h -E 'database_id|^id = ' wrangler.toml workers/*/wrangler.toml | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- resource ids ---"
          grep -h -E 'database_id|^id = ' wrangler.toml workers/*/wrangler.toml | sort -u

      - name: Confirm seeded row counts
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:verify -- --remote || npx wrangler d1 execute breachledger --remote --command "SELECT (SELECT COUNT(*) FROM data_classes) AS data_classes, (SELECT COUNT(*) FROM state_rights) AS state_rights, (SELECT COUNT(*) FROM remediation_modules) AS remediation_modules"
